name: Feature request
description: A diagram type, language, framework or viewer feature you'd like
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or goal, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Sample code, a diagram, or a sketch of the expected output.
